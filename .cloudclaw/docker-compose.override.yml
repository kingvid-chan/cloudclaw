# Cloud 接入 OpenClaw runtime 的 Compose override
# 由 .cloudclaw/start.sh 显式 -f 加载,docker-setup.sh 默认不会读到
# 仅在 .cloudclaw/ 内写入(AGENTS.md §3.2 合规)
#
# 设计:bind mount 划分为三类
#   ro 单文件: 人格档案与协议(SOUL/USER/AGENTS/HEARTBEAT/MEMORY_PROTOCOL/SELF_REVIEW/PROMPT_REVIEW_TEMPLATE)
#   ro 目录:   CLOUDCLAW_LIFE_SYSTEM_DIR + Gemini CLI(provider) -- agent 只读
#   rw 目录:   3 个 Cloud 产出区(对话纪要/周度报告/提案) -- agent 可写,但 git commit 由 Sky
services:
  openclaw-gateway:
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      # 人格档案与协议(read-only,Cloud 不改自身人格 / 规则)
      - "${CLOUDCLAW_PRIVATE_DIR}/SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/USER.md:/home/node/.openclaw/workspace/USER.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/HEARTBEAT.md:/home/node/.openclaw/workspace/HEARTBEAT.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/MEMORY_PROTOCOL.md:/home/node/.openclaw/workspace/MEMORY_PROTOCOL.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/SELF_REVIEW.md:/home/node/.openclaw/workspace/SELF_REVIEW.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/PROMPT_REVIEW_TEMPLATE.md:/home/node/.openclaw/workspace/PROMPT_REVIEW_TEMPLATE.md:ro"
      # Gemini CLI provider (host npm package + Cloud-owned wrapper)
      - "${CLOUDCLAW_GEMINI_CLI_DIR}:/opt/gemini-cli:ro"
      - "${CLOUDCLAW_WRAPPER_PATH}:/usr/local/bin/gemini:ro"
      # Sky 的人生系统档案(read-only,AGENTS.md §3.1 读边界 + §3.2/§4 写禁止)
      - "${CLOUDCLAW_LIFE_SYSTEM_DIR}:${CLOUDCLAW_LIFE_SYSTEM_MOUNT}:ro"
      # Cloud 产出区(read-write,Cloud 自治写入,Sky 来 git commit)
      - "${CLOUDCLAW_PRIVATE_DIR}/对话纪要:/home/node/.openclaw/workspace/对话纪要:rw"
      - "${CLOUDCLAW_PRIVATE_DIR}/周度报告:/home/node/.openclaw/workspace/周度报告:rw"
      - "${CLOUDCLAW_PRIVATE_DIR}/提案:/home/node/.openclaw/workspace/提案:rw"

  openclaw-cli:
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/home/node/.openclaw/workspace
      - "${CLOUDCLAW_PRIVATE_DIR}/SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/USER.md:/home/node/.openclaw/workspace/USER.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/HEARTBEAT.md:/home/node/.openclaw/workspace/HEARTBEAT.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/MEMORY_PROTOCOL.md:/home/node/.openclaw/workspace/MEMORY_PROTOCOL.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/SELF_REVIEW.md:/home/node/.openclaw/workspace/SELF_REVIEW.md:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/PROMPT_REVIEW_TEMPLATE.md:/home/node/.openclaw/workspace/PROMPT_REVIEW_TEMPLATE.md:ro"
      - "${CLOUDCLAW_GEMINI_CLI_DIR}:/opt/gemini-cli:ro"
      - "${CLOUDCLAW_WRAPPER_PATH}:/usr/local/bin/gemini:ro"
      - "${CLOUDCLAW_LIFE_SYSTEM_DIR}:${CLOUDCLAW_LIFE_SYSTEM_MOUNT}:ro"
      - "${CLOUDCLAW_PRIVATE_DIR}/对话纪要:/home/node/.openclaw/workspace/对话纪要:rw"
      - "${CLOUDCLAW_PRIVATE_DIR}/周度报告:/home/node/.openclaw/workspace/周度报告:rw"
      - "${CLOUDCLAW_PRIVATE_DIR}/提案:/home/node/.openclaw/workspace/提案:rw"
